[project]
name = "ai"
version = "0.1.0"
description = "BullMQ workers for PhotoDey face indexing and event photo search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bullmq>=3.0.4",
    "fastapi>=0.140.6",
    "httpx>=0.28.1",
    "insightface>=1.0.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.28.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
